name = "free-llm-router-sync"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Cron trigger - runs every hour at minute 0
[triggers]
crons = ["0 * * * *"]

# Observability - enable real-time logs
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1

# Staging environment
[env.staging]
name = "free-llm-router-sync-staging"
# ACTIVE_DB_SLOT is a text variable set by the GitHub Actions staging deployment.
# Secrets provisioned by the GitHub Actions staging deployment:
# - DATABASE_URL_ADMIN (slot 1)
# - DATABASE_URL_ADMIN_2 (slot 2)

# Production environment
[env.production]
name = "free-llm-router-sync-production"
# ACTIVE_DB_SLOT is a text variable set by the GitHub Actions production deployment.
# Secrets provisioned by the GitHub Actions production deployment:
# - DATABASE_URL_ADMIN (slot 1)
# - DATABASE_URL_ADMIN_2 (slot 2)
