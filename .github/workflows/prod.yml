name: Production Checks + Migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-checks:
    name: Production Sanity + Migrations
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Push database schema (production)
        run: |
          case "$ACTIVE_DB_SLOT" in
            1) ADMIN_URL="$DATABASE_URL_ADMIN" ;;
            2) export DATABASE_URL_OWNER="$DATABASE_URL_OWNER_2"; ADMIN_URL="$DATABASE_URL_ADMIN_2" ;;
            *) echo "Unsupported ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1 ;;
          esac
          test -n "$DATABASE_URL_OWNER" || { echo "Missing owner URL for ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1; }
          test -n "$ADMIN_URL" || { echo "Missing Worker admin URL for ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1; }
          bun run db:push
        env:
          ACTIVE_DB_SLOT: ${{ vars.ACTIVE_DB_SLOT }}
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          DATABASE_URL_OWNER_2: ${{ secrets.DATABASE_URL_OWNER_2 }}
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          DATABASE_URL_ADMIN_2: ${{ secrets.DATABASE_URL_ADMIN_2 }}

      - name: Build project
        run: bun run build
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [production-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - name: Set Cloudflare Pages DB slot
        run: |
          set -euo pipefail
          case "$ACTIVE_DB_SLOT" in
            1) suffix='' ;;
            2) suffix='_2' ;;
            *) echo "Unsupported ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1 ;;
          esac
          pages_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/free-llm-router"
          current=$(curl -fsS "$pages_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for key in "DATABASE_URL$suffix" "DATABASE_URL_ADMIN$suffix" "DATABASE_URL_STATS$suffix"; do
            jq -e --arg env "$PAGES_ENVIRONMENT" --arg key "$key" '.success == true and .result.deployment_configs[$env].env_vars[$key] != null' <<< "$current" > /dev/null || { echo "Pages $PAGES_ENVIRONMENT is missing $key" >&2; exit 1; }
          done
          body=$(jq -nc --arg env "$PAGES_ENVIRONMENT" --arg slot "$ACTIVE_DB_SLOT" '{deployment_configs:{($env):{env_vars:{ACTIVE_DB_SLOT:{type:"plain_text",value:$slot}}}}}')
          response=$(curl -fsS -X PATCH "$pages_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$body")
          jq -e '.success == true' <<< "$response" > /dev/null
        env:
          ACTIVE_DB_SLOT: ${{ vars.ACTIVE_DB_SLOT }}
          PAGES_ENVIRONMENT: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name free-llm-router --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-sync-worker:
    name: Deploy Sync Worker (Production)
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install worker dependencies
        working-directory: workers/sync-models
        run: bun install

      - name: Deploy to Cloudflare Workers (Production)
        working-directory: workers/sync-models
        run: |
          case "$ACTIVE_DB_SLOT" in
            1) ADMIN_SECRET_NAME=DATABASE_URL_ADMIN; ADMIN_URL="$DATABASE_URL_ADMIN" ;;
            2) ADMIN_SECRET_NAME=DATABASE_URL_ADMIN_2; ADMIN_URL="$DATABASE_URL_ADMIN_2" ;;
            *) echo "Unsupported ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1 ;;
          esac
          test -n "$ADMIN_URL" || { echo "Missing admin URL for ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1; }
          printf '%s' "$ADMIN_URL" | bunx wrangler secret put "$ADMIN_SECRET_NAME" --env production
          bunx wrangler deploy --env production --var "ACTIVE_DB_SLOT:$ACTIVE_DB_SLOT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTIVE_DB_SLOT: ${{ vars.ACTIVE_DB_SLOT }}
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          DATABASE_URL_ADMIN_2: ${{ secrets.DATABASE_URL_ADMIN_2 }}
