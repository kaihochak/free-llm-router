name: Production Checks + Migrations

on:
  push:
    branches: [main]

jobs:
  production-checks:
    name: Production Sanity + Migrations
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Push database schema (production)
        run: bun run db:push
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}

      - name: Build project
        run: bun run build
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [production-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy dist --project-name free-llm-router --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-sync-worker:
    name: Deploy Sync Worker (Production)
    needs: [production-checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install worker dependencies
        working-directory: workers/sync-models
        run: bun install

      - name: Deploy to Cloudflare Workers (Production)
        working-directory: workers/sync-models
        run: |
          printf '%s' "$ACTIVE_DB_SLOT" | bunx wrangler secret put ACTIVE_DB_SLOT --env production
          case "$ACTIVE_DB_SLOT" in
            1) ADMIN_SECRET_NAME=DATABASE_URL_ADMIN; ADMIN_URL="$DATABASE_URL_ADMIN_1" ;;
            2) ADMIN_SECRET_NAME=DATABASE_URL_ADMIN_2; ADMIN_URL="$DATABASE_URL_ADMIN_2" ;;
            *) echo "Unsupported ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1 ;;
          esac
          test -n "$ADMIN_URL" || { echo "Missing admin URL for ACTIVE_DB_SLOT=$ACTIVE_DB_SLOT" >&2; exit 1; }
          printf '%s' "$ADMIN_URL" | bunx wrangler secret put "$ADMIN_SECRET_NAME" --env production
          bun run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTIVE_DB_SLOT: ${{ vars.ACTIVE_DB_SLOT || '1' }}
          DATABASE_URL_ADMIN_1: ${{ secrets.DATABASE_URL_ADMIN }}
          DATABASE_URL_ADMIN_2: ${{ secrets.DATABASE_URL_ADMIN_2 }}
